# Include these directives in the active GrantMaestro Nginx server block on BinaryLane.
# Do not replace the existing TLS, SPA fallback or /v1 API proxy rules.

# Compression for text assets. Brotli requires the Brotli Nginx module; gzip is sufficient if it is unavailable.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml font/woff2;

# CRA content-hashed bundles can be cached for one year because a changed file gets a new name.
location ~* ^/(static/(css|js|media)/.+\.(?:css|js|mjs|map|svg|webp|png|jpe?g|gif|woff2?))$ {
    try_files $uri =404;
    access_log off;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# Keep the HTML shell fresh so it can refer to the current content-hashed bundle.
location = /index.html {
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
}

# SPA fallback. Keep this alongside the existing /v1 proxy location.
location / {
    try_files $uri $uri/ /index.html;
}
