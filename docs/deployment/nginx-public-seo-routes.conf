# GrantMaestro public SEO route snippet for BinaryLane Nginx.
#
# Include this file INSIDE the active `server { ... }` block for
# `server_name www.grantmaestro.com`, before its generic `location /` fallback.
# It is not a standalone Nginx configuration file.
#
# Important: replace the active generic SPA fallback with the final `location /`
# block below. Keep the existing `/v1` API reverse proxy and security headers.

# Canonicalise selected public route trailing slashes.
location ~ ^/(councils|grant-portfolio-readiness|resources|resources/council-grant-portfolio-readiness-guide|nonprofits|universities|religious-organisations|contact|privacy-policy|terms-of-service|support)/$ {
    return 301 https://www.grantmaestro.com/$1$is_args$args;
}

# Generated public route documents provide route-specific source HTML, metadata and JSON-LD.
location ~ ^/(councils|grant-portfolio-readiness|resources|resources/council-grant-portfolio-readiness-guide|nonprofits|universities|religious-organisations|contact|privacy-policy|terms-of-service|support)$ {
    try_files /$1.html =404;
    add_header Cache-Control "no-cache" always;
}

# Explicit authenticated routes retain the React application shell.
# They remain excluded from the XML sitemap and robots policy.
location ~ ^/(dashboard|profile|tasks|add-task|edit-task/|view-task/|team-members|add-team-member|edit-team-member/|grant(?:/|$)|acquittals|reports|settings|manage-payment|admin/|payment/|tickets|submit-ticket|update-ticket/|privacy-setting|subscription|seat-usage|change-password|force-password-reset|login|register|forgot-password|reset-password)$ {
    try_files /index.html =404;
    add_header Cache-Control "no-cache" always;
}

# Cache fingerprinted assets and social cards. Publish a new filename when a social card changes.
location ~* ^/(static/(css|js|media)/.+\.(?:css|js|mjs|map|svg|webp|png|jpe?g|gif|woff2?)|social/.+\.(?:png|jpe?g|webp))$ {
    try_files $uri =404;
    access_log off;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location = /index.html {
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
}

# Replace the current generic SPA fallback with this block. This makes unknown
# public URLs a genuine 404 while preserving explicit authenticated SPA routes above.
location / {
    try_files $uri $uri/ =404;
}

error_page 404 /404.html;
location = /404.html {
    internal;
    add_header Cache-Control "no-cache" always;
}
